[workspace]
git_tag_enable = true
git_release_enable = true
# In 0.x, a `feat` bumps the minor version, as a breaking change does (not the patch).
features_always_increment_minor = true

# The two crates are released under one version: the higher of their next versions.
[[package]]
name = "nearest"
version_group = "nearest"
changelog_path = "CHANGELOG.md"
changelog_include = ["nearest-derive"]
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

[[package]]
name = "nearest-derive"
version_group = "nearest"
changelog_update = false
git_tag_enable = false
git_release_enable = false

[[package]]
name = "xtask"
publish = false
changelog_update = false
git_tag_enable = false
git_release_enable = false
