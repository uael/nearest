name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # In five jobs, each under a minute: the tests, the compile-fail cases, the features (without
  # `alloc`, `serde`) and the examples, a region past 2 GiB, the benchmarks.
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `cargo test --all` in two: the compile-fail cases (trybuild builds each program) apart.
          - name: all
            run: cargo test --all -- --skip compile_fail
          - name: compile-fail
            run: cargo test -p nearest --test compile_fail
          - name: features, examples
            run: >-
              cargo test -p nearest --no-default-features --lib --test no_alloc &&
              cargo test -p nearest --features serde --test serde &&
              cargo test -p nearest --features serde --doc &&
              cargo run --example expr && cargo run --example passes && cargo run --example ir
          # A region past 2 GiB, with 8-byte pointers: about 4 GB of memory, seconds in release.
          - name: past 2 GiB
            run: cargo test --release -p nearest --test width -- --ignored
          # The benchmarks, once each.
          - name: benchmarks
            run: cargo bench --bench region -- --test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.name }}
      - run: ${{ matrix.run }}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --tests --examples --benches -- -D warnings
      - run: cargo clippy -p nearest --no-default-features --lib --test no_alloc -- -D warnings

  no_std:
    name: No std, no alloc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # A target without `std` or an allocator: nothing may need either.
      - run: cargo build -p nearest --no-default-features --target thumbv7em-none-eabihf
      # A 16-bit target, whose `core` is built from source on the pinned nightly.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-17
          components: rust-src
      - run: cargo +nightly-2026-11-17 build -p nearest --no-default-features -Zbuild-std=core --target msp430-none-elf

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `rustfmt.toml` uses unstable options.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-17
          components: rustfmt
      - run: cargo +nightly-2026-11-17 fmt --all -- --check

  # The `rust-version` of the crates (1.99, that of `puns`): the library, and the tests that use
  # it the most. `RUSTUP_TOOLCHAIN` takes precedence over `rust-toolchain`.
  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo test -p nearest --lib --test integration --test layouts

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all
        env:
          RUSTDOCFLAGS: -D warnings

  # Miri, with tree borrows (a self-relative pointer is resolved from its own address) and strict
  # provenance: one job for each run, side by side, each of at most a minute, build included.
  # The time that Miri reports is not the one that passes: read the times of the jobs.
  #
  # On x86-64, every test that Miri runs. The tests of `tests/common/integration.rs` run in three
  # storages (`integration`: the heap, `inline`, `user_storage`): the corruptions and the models,
  # the heaviest, under Miri for the heap only (the check of bytes and the edits do not depend
  # on the storage; all three run them natively). On the targets where what the code assumes of
  # x86-64 does not hold, what the target can change: on `i686` (32 bits: a `u64` aligned to 4,
  # an `isize` narrower than an `i64`) the library, the offsets and every storage; on `s390x`
  # (big-endian) the offsets and the image of `examples/ir.rs`, byte for byte. A test added to
  # `tests/common/integration.rs` runs in the jobs named after the storages. `tests/ir.rs` writes a
  # file: `-Zmiri-disable-isolation`, for its job only (`flags`).
  miri:
    name: Miri (${{ matrix.where }}, ${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-strict-provenance
      # Every `cargo` of the job is the nightly one: without this, the first one that is not
      # asked for it (the one of the cache action) installs the toolchain of `rust-toolchain`,
      # which the job does not use.
      RUSTUP_TOOLCHAIN: nightly-2026-11-17
      # Where Miri keeps the standard library that it builds for the target (cached, below).
      MIRI_SYSROOT: /home/runner/miri-sysroot
      # The sources that it builds it from, which the toolchain installs.
      MIRI_SOURCES: >-
        /home/runner/.rustup/toolchains/nightly-2026-11-17-x86_64-unknown-linux-gnu/lib/rustlib/src
    strategy:
      fail-fast: false
      matrix:
        include:
          - where: x86-64
            name: lib, no_alloc
            tests: --lib --test no_alloc
          - where: x86-64
            name: limits
            tests: >-
              --test width -- --exact the_size_limit_panics_and_leaves_a_valid_region
              capacity_past_the_size_limit_is_not_used bytes_past_the_size_limit_are_invalid
          # Without `alloc`.
          - where: x86-64
            name: no alloc
            tests: --no-default-features --test no_alloc
          - where: x86-64
            name: layouts, corpus
            tests: --test layouts --test corpus
          - where: x86-64
            name: ir
            tests: --test ir
            flags: -Zmiri-disable-isolation
          - where: x86-64
            name: width, 1 of 3
            tests: >-
              --test width -- w16:: w32:: w64:: be32:: i64be::
          - where: x86-64
            name: width, 2 of 3
            tests: >-
              --test width -- be16:: be64:: i16be:: i16le:: i32be:: byte_orders
          - where: x86-64
            name: width, 3 of 3
            tests: >-
              --test width -- --skip the_size_limit_panics_and_leaves_a_valid_region
              --skip capacity_past_the_size_limit_is_not_used
              --skip bytes_past_the_size_limit_are_invalid
              --skip w16:: --skip w32:: --skip w64:: --skip be32:: --skip i64be::
              --skip be16:: --skip be64:: --skip i16be:: --skip i16le:: --skip i32be::
              --skip byte_orders
          - where: x86-64
            name: heap
            tests: >-
              --test integration -- --exact --skip small_corruptions_are_rejected_or_harmless
              --skip moves_in_a_tree --skip random_edits_match_a_model --skip size_hint_may_lie
              --skip noise_is_rejected_without_panicking
              --skip random_expression_rewrites_match_a_model
          - where: x86-64
            name: heap, corruptions
            tests: >-
              --test integration -- --exact small_corruptions_are_rejected_or_harmless
              size_hint_may_lie
          - where: x86-64
            name: heap, noise
            tests: --test integration -- --exact noise_is_rejected_without_panicking
          - where: x86-64
            name: heap, models
            tests: >-
              --test integration -- --exact moves_in_a_tree random_edits_match_a_model
              random_expression_rewrites_match_a_model
          - where: x86-64
            name: inline, 1 of 2
            tests: >-
              --test inline -- --exact
              a_panic_in_a_list_operation_leaves_a_valid_list a_panic_leaves_the_old_value a_region_is_aligned_as_its_words a_region_moves_with_its_storage
              a_value_overwrites_every_pointer values_nested_deeper_than_puns_follows_are_a_limit build_and_read builders_compose
              builders_write_the_compact_image bytes_round_trip compaction constructors_box_pointer_fields
              enum_handles enums_generics_and_nesting every_emit_source every_primitive
              full_inline_storage
          - where: x86-64
            name: inline, 2 of 2
            tests: >-
              --test inline -- --exact --skip small_corruptions_are_rejected_or_harmless
              --skip moves_in_a_tree --skip random_edits_match_a_model --skip size_hint_may_lie
              --skip noise_is_rejected_without_panicking
              --skip random_expression_rewrites_match_a_model
              --skip a_panic_in_a_list_operation_leaves_a_valid_list
              --skip a_panic_leaves_the_old_value
              --skip a_region_is_aligned_as_its_words
              --skip a_region_moves_with_its_storage
              --skip a_value_overwrites_every_pointer
              --skip values_nested_deeper_than_puns_follows_are_a_limit
              --skip build_and_read
              --skip builders_compose
              --skip builders_write_the_compact_image
              --skip bytes_round_trip
              --skip compaction
              --skip constructors_box_pointer_fields
              --skip enum_handles
              --skip enums_generics_and_nesting
              --skip every_emit_source
              --skip every_primitive
              --skip full_inline_storage
          - where: x86-64
            name: user storage
            tests: >-
              --test user_storage -- --exact --skip small_corruptions_are_rejected_or_harmless
              --skip moves_in_a_tree --skip random_edits_match_a_model --skip size_hint_may_lie
              --skip noise_is_rejected_without_panicking
              --skip random_expression_rewrites_match_a_model
          - where: 32 bits
            target: i686-unknown-linux-gnu
            name: lib, no_alloc
            tests: --lib --test no_alloc
          - where: 32 bits
            target: i686-unknown-linux-gnu
            name: limits
            tests: >-
              --test width -- --exact the_size_limit_panics_and_leaves_a_valid_region
              capacity_past_the_size_limit_is_not_used bytes_past_the_size_limit_are_invalid
          - where: 32 bits
            target: i686-unknown-linux-gnu
            name: layouts, corpus
            tests: --test layouts --test corpus
          - where: 32 bits
            target: i686-unknown-linux-gnu
            name: width, 1 of 3
            tests: >-
              --test width -- w16:: w32:: w64:: be32:: i64be::
          - where: 32 bits
            target: i686-unknown-linux-gnu
            name: width, 2 of 3
            tests: >-
              --test width -- be16:: be64:: i16be:: i16le:: i32be:: byte_orders
          - where: 32 bits
            target: i686-unknown-linux-gnu
            name: width, 3 of 3
            tests: >-
              --test width -- --skip the_size_limit_panics_and_leaves_a_valid_region
              --skip capacity_past_the_size_limit_is_not_used
              --skip bytes_past_the_size_limit_are_invalid
              --skip w16:: --skip w32:: --skip w64:: --skip be32:: --skip i64be::
              --skip be16:: --skip be64:: --skip i16be:: --skip i16le:: --skip i32be::
              --skip byte_orders
          - where: 32 bits
            target: i686-unknown-linux-gnu
            name: heap
            tests: >-
              --test integration -- --exact --skip small_corruptions_are_rejected_or_harmless
              --skip moves_in_a_tree --skip random_edits_match_a_model --skip size_hint_may_lie
              --skip noise_is_rejected_without_panicking
              --skip random_expression_rewrites_match_a_model
          - where: 32 bits
            target: i686-unknown-linux-gnu
            name: inline, 1 of 2
            tests: >-
              --test inline -- --exact
              a_panic_in_a_list_operation_leaves_a_valid_list a_panic_leaves_the_old_value a_region_is_aligned_as_its_words a_region_moves_with_its_storage
              a_value_overwrites_every_pointer values_nested_deeper_than_puns_follows_are_a_limit build_and_read builders_compose
              builders_write_the_compact_image bytes_round_trip compaction constructors_box_pointer_fields
              enum_handles enums_generics_and_nesting every_emit_source every_primitive
              full_inline_storage
          - where: 32 bits
            target: i686-unknown-linux-gnu
            name: inline, 2 of 2
            tests: >-
              --test inline -- --exact --skip small_corruptions_are_rejected_or_harmless
              --skip moves_in_a_tree --skip random_edits_match_a_model --skip size_hint_may_lie
              --skip noise_is_rejected_without_panicking
              --skip random_expression_rewrites_match_a_model
              --skip a_panic_in_a_list_operation_leaves_a_valid_list
              --skip a_panic_leaves_the_old_value
              --skip a_region_is_aligned_as_its_words
              --skip a_region_moves_with_its_storage
              --skip a_value_overwrites_every_pointer
              --skip values_nested_deeper_than_puns_follows_are_a_limit
              --skip build_and_read
              --skip builders_compose
              --skip builders_write_the_compact_image
              --skip bytes_round_trip
              --skip compaction
              --skip constructors_box_pointer_fields
              --skip enum_handles
              --skip enums_generics_and_nesting
              --skip every_emit_source
              --skip every_primitive
              --skip full_inline_storage
          - where: 32 bits
            target: i686-unknown-linux-gnu
            name: user storage
            tests: >-
              --test user_storage -- --exact --skip small_corruptions_are_rejected_or_harmless
              --skip moves_in_a_tree --skip random_edits_match_a_model --skip size_hint_may_lie
              --skip noise_is_rejected_without_panicking
              --skip random_expression_rewrites_match_a_model
          - where: big-endian
            target: s390x-unknown-linux-gnu
            name: layouts, corpus
            tests: --test layouts --test corpus
          - where: big-endian
            target: s390x-unknown-linux-gnu
            name: ir
            tests: --test ir
            flags: -Zmiri-disable-isolation
          - where: big-endian
            target: s390x-unknown-linux-gnu
            name: width, 1 of 4
            tests: >-
              --test width -- w16:: w32:: w64::
          - where: big-endian
            target: s390x-unknown-linux-gnu
            name: width, 2 of 4
            tests: >-
              --test width -- be32:: i64be::
          - where: big-endian
            target: s390x-unknown-linux-gnu
            name: width, 3 of 4
            tests: >-
              --test width -- be16:: be64:: i16be:: i16le:: i32be:: byte_orders
          - where: big-endian
            target: s390x-unknown-linux-gnu
            name: width, 4 of 4
            tests: >-
              --test width -- --skip the_size_limit_panics_and_leaves_a_valid_region
              --skip capacity_past_the_size_limit_is_not_used
              --skip bytes_past_the_size_limit_are_invalid
              --skip w16:: --skip w32:: --skip w64:: --skip be32:: --skip i64be::
              --skip be16:: --skip be64:: --skip i16be:: --skip i16le:: --skip i32be::
              --skip byte_orders
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-17
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri-${{ matrix.target || 'host' }}
      # The standard library of Miri for the target, built by `cargo miri setup` when the cache
      # does not have it. With the sources it was built from: Miri builds it again when the
      # modification time of one of them is not what it was, and each run installs them anew.
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.MIRI_SYSROOT }}
            ${{ env.MIRI_SOURCES }}
          key: miri-std-nightly-2026-11-17-${{ matrix.target || 'host' }}
      - run: cargo miri setup ${{ matrix.target && format('--target {0}', matrix.target) }}
      - env:
          MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-strict-provenance ${{ matrix.flags }}
        run: >-
          cargo miri test -p nearest
          ${{ matrix.target && format('--target {0}', matrix.target) }} ${{ matrix.tests }}

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rm rust-toolchain
      - uses: EmbarkStudios/cargo-deny-action@v2
