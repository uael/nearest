name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all
      - run: cargo test -p nearest --no-default-features --lib --test no_alloc
      - run: cargo test -p nearest --features serde --test serde
      - run: cargo test -p nearest --features serde --doc
      - run: cargo run --example expr
      - run: cargo run --example ir
      - run: cargo bench --bench region -- --test

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --tests --examples --benches -- -D warnings
      - run: cargo clippy -p nearest --no-default-features --lib --test no_alloc -- -D warnings

  no_std:
    name: No std, no alloc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # A target without `std` or an allocator: nothing may need either.
      - run: cargo build -p nearest --no-default-features --target thumbv7em-none-eabihf

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `rustfmt.toml` uses unstable options.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-10
          components: rustfmt
      - run: cargo +nightly-2026-02-10 fmt --all -- --check

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all
        env:
          RUSTDOCFLAGS: -D warnings

  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-10
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      # The default configuration, with every storage; without `alloc`; the `nightly` feature
      # adds `tests/pin_v2.rs` (the `nightly` job runs the other tests natively with the feature).
      - run: cargo +nightly-2026-02-10 miri test -p nearest --lib --test integration --test inline --test user_storage --test no_alloc
        env:
          MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-strict-provenance
      - run: cargo +nightly-2026-02-10 miri test -p nearest --no-default-features --test no_alloc
        env:
          MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-strict-provenance
      - run: cargo +nightly-2026-02-10 miri test -p nearest --features nightly --test pin_v2
        env:
          MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-strict-provenance

  nightly:
    name: Nightly feature
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-10
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly-2026-02-10 clippy --workspace --features nearest/nightly --tests --examples --benches -- -D warnings
      # The trybuild test stays on stable: its expected messages are those of the pinned stable.
      - run: cargo +nightly-2026-02-10 test -p nearest --features nightly --lib --test integration --test pin_v2
      - run: cargo +nightly-2026-02-10 test -p nearest --features nightly --doc
      - run: cargo +nightly-2026-02-10 test -p nearest --no-default-features --features nightly --lib --test no_alloc

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rm rust-toolchain
      - uses: EmbarkStudios/cargo-deny-action@v2
