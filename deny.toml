[advisories]
version = 2

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# `puns` at the revision that `nearest` needs, until it is released: replace the git dependency
# by the release, and remove this, before `nearest` is released (crates.io refuses a git
# dependency).
allow-git = ["https://github.com/uael/puns"]
