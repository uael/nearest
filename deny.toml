[advisories]
version = 2

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# `puns` at a commit that is not released yet (its aims), which `nearest` depends on by git.
allow-git = ["https://github.com/uael/puns"]
