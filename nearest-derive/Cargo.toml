[package]
name = "nearest-derive"
version = "0.5.2"
edition.workspace = true
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "The #[flat] attribute for the nearest crate"
repository = "https://github.com/uael/nearest"
documentation = "https://docs.rs/nearest-derive"
readme = "../README.md"
keywords = ["self-relative", "pointer", "derive", "macro"]
categories = ["data-structures"]

[lib]
proc-macro = true

[features]
# Enabled by `nearest/nightly`: `#[flat]` marks every type `#[pin_v2]`.
nightly = []

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[lints]
workspace = true
