[package]
name = "nearest"
version = "0.8.1"
edition.workspace = true
rust-version = "1.99"
license = "Apache-2.0 OR MIT"
description = "Self-relative pointer library for region-based allocation"
repository = "https://github.com/uael/nearest"
documentation = "https://docs.rs/nearest"
readme = "../README.md"
keywords = ["self-relative", "pointer", "region", "allocation", "arena"]
categories = ["data-structures", "memory-management"]
# The specification, for contributors: not shipped.
exclude = ["CLAUDE.md"]

[features]
default = ["alloc"]
# The heap: `Region<T>`, its default storage, and `from_bytes` and `view`, whose
# check takes memory from the heap. Without it, regions live in other storage
# (`Region<T, Inline<N>>`), and loaded bytes are checked with memory from the caller
# (`from_bytes_with`, `view_with`).
alloc = []
# `Serialize` and `Deserialize` for `Region`: its bytes, checked when loaded.
serde = ["alloc", "dep:serde"]

[dependencies]
nearest-derive = { version = "=0.8.1", path = "../nearest-derive" }
# The layouts and the validity of values: `Pun` for every stored type, its check, and the numbers
# of a fixed byte order (`puns::num`). Re-exported as `nearest::puns`. A revision after 0.2.0-beta.2
# (an `Option` of a scalar that a pun never makes), until its release: `cargo publish` would take
# 0.2.0-beta.2 from crates.io instead, and refuse to build with it.
puns = { version = "0.2.0-beta.2", git = "https://github.com/uael/puns", rev = "43cb1c25865527a7a9da8b2089cf479357756a56" }
serde = { version = "1", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
serde_json = "1"
serde_test = "1"
criterion = { version = "0.5", features = ["html_reports"] }
trybuild = "1"

[[bench]]
name = "region"
harness = false

[package.metadata.docs.rs]
features = ["serde"]

[lints]
workspace = true
