[package]
name = "nearest"
version = "0.4.5"
edition.workspace = true
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
description = "Self-relative pointer library for region-based allocation"
repository = "https://github.com/uael/nearest"
documentation = "https://docs.rs/nearest"
readme = "../README.md"
keywords = ["self-relative", "pointer", "region", "allocation", "arena"]
categories = ["data-structures", "memory-management"]

[features]
# APIs that may change in any release. Today: `update` on every handle.
unstable = ["nearest-derive/unstable"]

[dependencies]
nearest-derive = { version = "=0.3.5", path = "../nearest-derive" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
trybuild = "1"

[[bench]]
name = "region"
harness = false

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
