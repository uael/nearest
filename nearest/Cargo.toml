[package]
name = "nearest"
version = "0.8.1"
edition.workspace = true
rust-version = "1.100"
license = "Apache-2.0 OR MIT"
description = "Self-relative pointer library for region-based allocation"
repository = "https://github.com/uael/nearest"
documentation = "https://docs.rs/nearest"
readme = "../README.md"
keywords = ["self-relative", "pointer", "region", "allocation", "arena"]
categories = ["data-structures", "memory-management"]
# The specification, for contributors: not shipped.
exclude = ["CLAUDE.md"]

[features]
default = ["alloc"]
# The global allocator: `Region<T>`, whose blocks come from `Global`. Without it, regions take
# their blocks from an allocator that they name, such as `Fixed` over a buffer.
alloc = []
# `Serialize` and `Deserialize` for `Region`: its bytes, checked when loaded.
serde = ["alloc", "dep:serde"]

[dependencies]
nearest-derive = { version = "=0.8.1", path = "../nearest-derive" }
# The layouts and the validity of values: `Pun` for every stored type, its check (the pointees of
# the pointers included, which are aims), and the numbers of a fixed byte order (`puns::num`).
# Re-exported as `nearest::puns`. Pinned to a commit: aims are not released yet. The version is
# the one of that commit, which `cargo deny` requires (a git dependency without one is a wildcard).
puns = { version = "=0.2.4", git = "https://github.com/uael/puns", rev = "94eb0a3f70a8adb3d4b115895794641c29e7bab7" }
serde = { version = "1", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
serde_json = "1"
serde_test = "1"
criterion = { version = "0.5", features = ["html_reports"] }
trybuild = "1"

[[bench]]
name = "region"
harness = false

[package.metadata.docs.rs]
features = ["serde"]

[lints]
workspace = true
